spring:
  config:
    activate:
      on-profile: dev
  
  data:
    mongodb:
      uri: ${DEV_MONGODB_URI}
      database: tinyslash_dev
      auto-index-creation: true

  # CORS handling moved to SecurityConfig.java

app:
  frontend:
    url: ${DEV_FRONTEND_URL:http://localhost:3000}
  shorturl:
    domain: ${DEV_SHORT_URL_DOMAIN:http://localhost:8080}
  admin:
    enabled: true

logging:
  level:
    com.urlshortener: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG