spring:
  config:
    activate:
      on-profile: prod
  
  data:
    mongodb:
      uri: ${PROD_MONGODB_URI}
      database: pebly-database
      auto-index-creation: false

    redis:
      host: ${REDIS_HOST:liberal-antelope-51934.upstash.io}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true

  cache:
    type: ${CACHE_TYPE:simple}

  # CORS handling moved to SecurityConfig.java

app:
  frontend:
    url: https://tinyslash.com
  shorturl:
    domain: https://tinyslash.com
    feistel-key: ${FEISTEL_KEY:98124712984210921} # Needs 64-bit long
  backend:
    url: ${BACKEND_URL:https://api.tinyslash.com}
  admin:
    enabled: true


cloudflare:
  saas:
    fallback-origin: api.tinyslash.com

logging:
  level:
    com.urlshortener: INFO
    org.springframework.data.mongodb.core.MongoTemplate: ERROR
