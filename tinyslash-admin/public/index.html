<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Pebly Admin Panel - Manage your URL shortening platform" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Pebly Admin Panel</title>
</head>

<body>
  <!-- RAW ERROR TRAP -->
  <div id="raw-error-display"
    style="display:none; position:fixed; top:0; left:0; width:100%; z-index:99999; background:red; color:white; padding:20px; font-family:monospace; font-size:16px; white-space:pre-wrap;">
  </div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      var el = document.getElementById('raw-error-display');
      el.style.display = 'block';
      el.innerText += "[GLOBAL ERROR]: " + message + " at " + source + ":" + lineno + "\n" + (error ? error.stack : '') + "\n\n";
    };
    window.onunhandledrejection = function (event) {
      var el = document.getElementById('raw-error-display');
      el.style.display = 'block';
      el.innerText += "[UNHANDLED PROMISE]: " + event.reason + "\n\n";
    };
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
