server.port=8080
spring.application.name=url-shortener-backend

# MongoDB is now enabled - configured in application.yml
# Disable H2 and JPA auto-configuration since we're using MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# CORS settings removed - configuration moved to SecurityConfig.java handles this programmatically

# Logging
logging.level.com.urlshortener=INFO
logging.level.org.springframework.web=DEBUG